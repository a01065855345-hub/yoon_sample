<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>댓글 추가/삭제</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            padding: 30px;
        }
        ul {
            list-style-type: none; 
            padding: 0;
        }
        li {
            background-color: #f1f1f1;
            margin: 5px 0;
            padding: 10px;
            border-bottom: 1px solid #ccc;
            cursor: pointer; 
        }
        li:hover {
            background-color: #ffdddd; 
        }
        li:hover::after {
            content: " (클릭하여 삭제)";
            color: red;
            font-size: 0.8em;
            font-weight: bold;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #e7279a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
    <script>
        function addComment() {
            var inputStr = prompt("추가할 댓글 내용을 입력하세요:", "종강 마렵습니다. 진짜");

            if (inputStr == null || inputStr.trim() == "") {
                return; 
            }

            var parent = document.getElementById("commentList");

            var newLi = document.createElement("li");
            newLi.innerHTML = inputStr;

            newLi.onclick = function() {
                var p = this.parentElement; 
                p.removeChild(this);      
            };

          
            parent.appendChild(newLi);
        }
    </script>
</head>
<body onload="addComment()"> 

    <h3>댓글 추가/삭제 프로그램</h3>
    <p>아래 목록을 클릭하면 해당 항목이 삭제됩니다.</p>
    <hr>

    <button onclick="addComment()">+ 댓글 추가하기</button>

    <ul id="commentList">
    </ul>

</body>
</html>
