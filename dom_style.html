<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DOM 스타일 변환기</title>
  <style>
 body {
 font-family: 'Noto Sans KR', sans-serif;
 text-align: center;
 padding: 50px;
 }
 
 #target {
 font-size: 20px;
 font-weight: bold;
 padding: 20px;
 border: 2px solid #86963f;
 margin: 20px auto;
 width: 80%;
 transition: all 0.3s; 
 }
  button {
 padding: 10px 15px;
 font-size: 16px;
 margin: 5px;
 cursor: pointer;
 background-color: #eee;
 border: 1px solid #999;
 border-radius: 5px;
 }
 button:hover {
 background-color: #ddd;
 }
  </style>
  <script>
    function changeColor() {
var obj = document.getElementById("target");
            obj.style.color = "blue";
    }
    function changeSize() {
        var obj = document.getElementById("target");
        obj.style.fontSize = "32px";
    }
    function changeBackground() {
         var obj = document.getElementById("target");
         obj.style.backgroundColor = "yellow";
    }
    function toggleVisibility() {
 var obj = document.getElementById("target");
 
 if(obj.style.display == "none") {
 obj.style.display = "block";
 } else {
 obj.style.display = "none";
 }
 }
  </script>
</head>
<body>
    <h3>DOM 스타일 제어하기</h3>
    <hr>
    <br>
<p id="target">이 문장의 스타일을 바꿔보세요!</p>
<botton onclick="changeColor()">[글자색 변경] </botton>
<botton onclick="changeSize()">[크게 보기] </botton>
<botton onclick="changeBackground()">[배경 강조] </botton>
 <button onclick="toggleVisibility()">[숨기기/보이기]</button>
</body>
</html>
