<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>스마트 피자 주문서</title>
    <style>

    </style>
    <script>
        function recalc() {
            var total = 0;
            var checks = document.getElementsByClassName("menu-check");
            var qtys = document.getElementsByClassName("menu-qty");
            for (var i = 0; i < checks.length; i++) {
                if (checks[i].checked) {
                    var price = parseInt(checks[i].value);
                    var quantity = parseInt(qtys[i].value);
                    total += price * quantity;
                }
            }
            document.getElementById("total").value = total;
        }
        function cheakAddress() {
            var addr = document.getElementById("addr");
            if (addr.value == "") {
                alert("배달 받으실 주소를 반드시 입력해주세요");
                addr.focus();
            }
        }
        function validate(e) {
            var total = parseInt(document.getElementById("total").value);
            if (total == 0) alert("메뉴를선택해주세요.");
            else alert("주문완료!총액: " + total + "원");
            e.preventDefault();
            return false;
        }
    </script>
</head>
<h3>피자 주문서 (이벤트 활용)</h3>
<hr>

<form action="#" onsubmit="return validate(event)">

    <body>
        <div id="menu_box">
            <h4>메뉴[선택]</h4>
            <div>
                <input type="checkbox" class="menu-check" value="15000" onchange="recalc()"> 콤비네이션피자원(15,000)
                <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()">개
            </div>
            <div>
                <input type="checkbox" class="menu-check" value="15000" onchange="recalc()"> 고구마피자원(13,000)
                <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()">개
            </div>
            <div>
                <input type="checkbox" class="menu-check" value="15000" onchange="recalc()"> 핫치킨피자원(12,000)
                <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()">개
            </div>
            <div>
                <input type="checkbox" class="menu-check" value="15000" onchange="recalc()"> 콜라(2,000)
                <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()">개
            </div>
            <div>
                <input type="checkbox" class="menu-check" value="15000" onchange="recalc()"> 핫소스(1,000)
                <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()">개
            </div>

        </div>
        배달 주소: <input type="text" id="addr" size="50" onblur="checkAddress()" placeholder="주소를 입력하세요">
        <br><br>

        주문 합계: <input type="text" id="total" value="0" readonly> 원
        <br><br>

        <input type="submit" value="주문하기">
        <input type="reset" value="초기화" onclick="setTimeout(recalc, 0)">
</form>


</body>

</html>
